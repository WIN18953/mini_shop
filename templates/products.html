{% extends "base.html" %}
{% block content %}

<div class="hero text-center mb-5 shadow">
    <h1 class="fw-bold display-5">Welcome to MiniShop</h1>
    <p class="lead">Premium products with modern experience</p>
</div>

<div class="row">
{% for product in products %}
<div class="col-md-4 mb-5">
<div class="card h-100 shadow-sm">

<img src="{{ product.image or 'https://via.placeholder.com/400' }}"
     class="card-img-top">

<div class="card-body d-flex flex-column">
<h5 class="fw-bold">{{ product.name }}</h5>
<p class="text-muted">{{ product.description }}</p>

<div class="mt-auto">
<h4 class="fw-bold text-success">฿ {{ product.price }}</h4>

<a href="{{ url_for('add_to_cart', id=product.id) }}"
   class="btn btn-primary w-100 mt-3">
   🛒 Add to Cart
</a>

</div>
</div>
</div>
</div>
{% endfor %}
</div>

{% endblock %}
